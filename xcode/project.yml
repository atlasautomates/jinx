name: LeadDashboard

# Wraps the SwiftPM sources (../Sources/LeadDashboard) into a proper .app bundle so
# the app is registered with Launch Services — the prerequisite for App Intents / Siri
# (Phase 2) and Developer-ID distribution (Phase 4). `swift run` / `--selftest` still
# work against the root Package.swift for dev; this target produces the shippable .app.

options:
  bundleIdPrefix: com.atlasautomates
  deploymentTarget:
    macOS: "14.0"          # Observation (@Observable) + Swift Charts baseline
  createIntermediateGroups: true

targets:
  LeadDashboard:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/LeadDashboard   # the single app target's Swift sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: LeadDashboard
        CFBundleDisplayName: Lead Dashboard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: "Atlas Automates"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasautomates.leaddashboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"                   # Swift 5 language mode (matches the SPM build)
        # Single self-contained executable — no split LeadDashboard.debug.dylib (the
        # @rpath debug-dylib crashes with a Team-ID mismatch when the .app is copied
        # elsewhere, e.g. to /tmp or /Applications). Required for a portable/shippable app.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES          # required for notarization (Phase 4)
        CODE_SIGN_ENTITLEMENTS: LeadDashboard.entitlements
        # Dev builds ad-hoc sign so the .app runs locally; Phase 4 swaps in Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
